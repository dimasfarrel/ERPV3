name: erp_malang
description: "ERP System - Project Malang | Enterprise Resource Planning Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # UI & Fonts
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
